name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Verify Capacitor files
        run: |
          echo "Checking Capacitor generated files..."

          if [ ! -f "android/capacitor-cordova-android-plugins/cordova.variables.gradle" ]; then
            echo "cordova.variables.gradle missing, running Capacitor update..."
            npx cap update android
            npx cap sync android
          fi

          if [ ! -f "android/capacitor-cordova-android-plugins/cordova.variables.gradle" ]; then
            echo "::error::cordova.variables.gradle still missing!"
            find android -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "cordova.variables.gradle OK"

      - name: Create release keystore
        working-directory: android/app
        run: |
          if [ ! -f release.keystore ]; then
            echo "Creating release.keystore..."

            keytool -genkeypair \
              -v \
              -keystore release.keystore \
              -alias mori \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android123 \
              -keypass android123 \
              -dname "CN=Mori, OU=Mori, O=Mori, L=Jakarta, ST=Jakarta, C=ID"

            echo "release.keystore created."
          else
            echo "release.keystore already exists."
          fi

      - name: Grant Gradle permission
        run: chmod +x android/gradlew

      - name: Clean Gradle
        working-directory: android
        run: ./gradlew clean --no-daemon

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace --warning-mode all

      - name: Verify APK
        run: |
          echo "APK output:"
          find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::APK tidak ditemukan!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mori-Premium-Release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
