name: Build Capacitor Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install npm dependencies
        run: |
          npm install

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Verify generated Cordova Gradle files
        run: |
          if [ ! -f "android/capacitor-cordova-android-plugins/cordova.variables.gradle" ]; then
            echo "::error::cordova.variables.gradle was not generated."
            echo "Checking Capacitor Android directories:"
            find android -maxdepth 3 -type f -name "*.gradle" | sort | head -200 || true
            exit 1
          fi
          echo "cordova.variables.gradle exists."

      - name: Grant Gradle permission
        run: chmod +x android/gradlew

      - name: Clean Android
        working-directory: android
        run: ./gradlew clean

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Find APK
        run: |
          echo "Generated APK files:"
          find android/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: am-premium-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
