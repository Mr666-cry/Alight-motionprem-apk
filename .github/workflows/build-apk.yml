name: build-apk

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # JANGAN PAKAI npm ci
      # package-lock.json project tidak sinkron dengan package.json
      - name: Install npm dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Check Capacitor
        run: |
          npx cap --version

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Verify Cordova Gradle files
        run: |
          if [ ! -f "android/capacitor-cordova-android-plugins/cordova.variables.gradle" ]; then
            echo "cordova.variables.gradle belum ada."
            echo "Menjalankan cap update..."
            npx cap update android
            npx cap sync android
          fi

          if [ ! -f "android/capacitor-cordova-android-plugins/cordova.variables.gradle" ]; then
            echo "::error::cordova.variables.gradle tidak berhasil dibuat!"
            find android -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "cordova.variables.gradle ditemukan."

      - name: Prepare Gradle
        run: |
          chmod +x android/gradlew

      - name: Clean Android
        working-directory: android
        run: |
          ./gradlew clean --no-daemon

      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Check APK
        run: |
          echo "=== APK HASIL BUILD ==="

          find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

          COUNT=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::APK tidak ditemukan!"
            exit 1
          fi

          echo "APK berhasil dibuat."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Am-Premium-Release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
